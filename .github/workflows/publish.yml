name: publish
permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-node@v3
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun ./build.ts
      - run: npm stage publish
